services:
  db:
    image: pgvector/pgvector:pg17
    container_name: plant-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: agro_db
    ports:
      - "1432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agro_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: